<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Carl's List</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
        <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&family=Roboto:ital,wght@0,100..900;1,100..900&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="music-player.css">
    </head>
    <body >
        <!-- <audio controls src="./musictitle.mp3"></audio> -->
         <div class="glitch-bg">
        <div id="music-player" >
            <img id="song-image" src="./FaceOff.JPG"/>
            <div id="song-name">Song</div>
            <div id="song-artist">Artist</div>

            <input id="slider-song" type="range">

            <div id="music-buttons">
                <i id="shuffle-song" class="fa-solid fa-shuffle"></i>                
                <i id="prev-song" class="fa-solid fa-backward-step fa-2x"></i>
                <i id="playpause-song" class="fa-solid fa-circle-play fa-3x"></i>
                <i id="next-song" class="fa-solid fa-forward-step fa-2x"></i>
                <i id="repeat-song" class="fa-solid fa-repeat"></i>                
            </div>
        </div>
        <script src="music-player.js"></script>
        </div>
    </body>
</html>
